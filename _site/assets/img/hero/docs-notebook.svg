<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" aria-hidden="true">
  <rect width="1200" height="600" fill="none"/>
  <!-- left margin -->
  <rect x="120" y="0" width="8" height="600" fill="#ff6b6b" opacity=".45"/>
  <!-- ruled lines -->
  <g stroke="white" stroke-opacity=".07">
    <line x1="0" y1="110" x2="1200" y2="110"/>
    <line x1="0" y1="170" x2="1200" y2="170"/>
    <line x1="0" y1="230" x2="1200" y2="230"/>
    <line x1="0" y1="290" x2="1200" y2="290"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="0" y1="410" x2="1200" y2="410"/>
    <line x1="0" y1="470" x2="1200" y2="470"/>
    <line x1="0" y1="530" x2="1200" y2="530"/>
  </g>
  <!-- subtle corner ring binder hint -->
  <g fill="white" opacity=".08">
    <circle cx="120" cy="140" r="8"/>
    <circle cx="120" cy="260" r="8"/>
    <circle cx="120" cy="380" r="8"/>
    <circle cx="120" cy="500" r="8"/>
  </g>
</svg>