<svg xmlns="http://www.w3.org/2000/svg" viewBox="-22 -22 44 44">
  <!--
    iVirus favicon — 8-spike virus particle
    Matches the virus-motif.svg visual language used in page backgrounds.
    Light mode: #2b6ff2 (--accent)
    Dark mode:  #6aa6ff (--accent dark)
  -->
  <style>
    .cap { stroke: #2b6ff2; fill: none; stroke-linecap: round; }
    .spk { stroke: #2b6ff2; fill: none; stroke-linecap: round; }
    .dot { fill: #2b6ff2; }
    @media (prefers-color-scheme: dark) {
      .cap, .spk { stroke: #6aa6ff; }
      .dot        { fill:   #6aa6ff; }
    }
  </style>

  <!-- capsid ring -->
  <circle class="cap" cx="0" cy="0" r="9" stroke-width="2"/>

  <!-- 8 spikes: N, NE, E, SE, S, SW, W, NW -->
  <line class="spk" x1="0"    y1="-9"   x2="0"     y2="-15"  stroke-width="1.6"/>
  <line class="spk" x1="6.4"  y1="-6.4" x2="10.6"  y2="-10.6" stroke-width="1.6"/>
  <line class="spk" x1="9"    y1="0"    x2="15"    y2="0"    stroke-width="1.6"/>
  <line class="spk" x1="6.4"  y1="6.4"  x2="10.6"  y2="10.6" stroke-width="1.6"/>
  <line class="spk" x1="0"    y1="9"    x2="0"     y2="15"   stroke-width="1.6"/>
  <line class="spk" x1="-6.4" y1="6.4"  x2="-10.6" y2="10.6" stroke-width="1.6"/>
  <line class="spk" x1="-9"   y1="0"    x2="-15"   y2="0"    stroke-width="1.6"/>
  <line class="spk" x1="-6.4" y1="-6.4" x2="-10.6" y2="-10.6" stroke-width="1.6"/>

  <!-- receptor dots at spike tips -->
  <circle class="dot" cx="0"    cy="-17"  r="2.2"/>
  <circle class="dot" cx="12"   cy="-12"  r="2.2"/>
  <circle class="dot" cx="17"   cy="0"    r="2.2"/>
  <circle class="dot" cx="12"   cy="12"   r="2.2"/>
  <circle class="dot" cx="0"    cy="17"   r="2.2"/>
  <circle class="dot" cx="-12"  cy="12"   r="2.2"/>
  <circle class="dot" cx="-17"  cy="0"    r="2.2"/>
  <circle class="dot" cx="-12"  cy="-12"  r="2.2"/>
</svg>
