<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 180" role="img" aria-label="iVirus viromics pipeline: Raw Reads → QC and Trim → Assembly → Viral ID → Gene Calling → Annotation → Taxonomy → Ecology and Visualization">
  <style>
    .box  { fill: rgba(43,111,242,.10); stroke: rgba(43,111,242,.40); stroke-width: 1.5; }
    .lbl  { font: 600 12px 'Inter',system-ui,sans-serif; fill: #2b6ff2; }
    .sub  { font: 400 9px 'Inter',system-ui,sans-serif; fill: #666; }
    .arr  { stroke: rgba(43,111,242,.45); stroke-width: 2; fill: none; marker-end: url(#ah); }
    .num  { font: 700 9px 'Inter',system-ui,sans-serif; fill: #fff; }
    .nbg  { fill: #2b6ff2; }
    .ah-p { fill: rgba(43,111,242,.55); }
    @media (prefers-color-scheme: dark) {
      .box  { fill: rgba(106,166,255,.10); stroke: rgba(106,166,255,.35); }
      .lbl  { fill: #6aa6ff; }
      .sub  { fill: #999; }
      .arr  { stroke: rgba(106,166,255,.4); }
      .nbg  { fill: #4a8fff; }
      .ah-p { fill: rgba(106,166,255,.5); }
    }
  </style>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon class="ah-p" points="0 0,8 3,0 6"/>
    </marker>
  </defs>

  <!-- Step 1: Raw Reads  x=15 cx=62 -->
  <rect class="box" x="15"  y="38" width="95" height="104" rx="10"/>
  <circle class="nbg" cx="62"  cy="58" r="11"/>
  <text class="num" x="62"  y="62" text-anchor="middle">1</text>
  <text class="lbl" x="62"  y="80" text-anchor="middle">Raw</text>
  <text class="lbl" x="62"  y="94" text-anchor="middle">Reads</text>
  <text class="sub" x="62"  y="114" text-anchor="middle">FASTQ files</text>

  <!-- arrow 1→2 -->
  <line class="arr" x1="111" y1="90" x2="124" y2="90"/>

  <!-- Step 2: QC & Trim  x=128 cx=175 -->
  <rect class="box" x="128" y="38" width="95" height="104" rx="10"/>
  <circle class="nbg" cx="175" cy="58" r="11"/>
  <text class="num" x="175" y="62" text-anchor="middle">2</text>
  <text class="lbl" x="175" y="78" text-anchor="middle">QC &amp; Trim</text>
  <text class="sub" x="175" y="97" text-anchor="middle">FastQC · BBDuk</text>
  <text class="sub" x="175" y="109" text-anchor="middle">fastp · MultiQC</text>

  <!-- arrow 2→3 -->
  <line class="arr" x1="224" y1="90" x2="237" y2="90"/>

  <!-- Step 3: Assembly  x=241 cx=288 -->
  <rect class="box" x="241" y="38" width="95" height="104" rx="10"/>
  <circle class="nbg" cx="288" cy="58" r="11"/>
  <text class="num" x="288" y="62" text-anchor="middle">3</text>
  <text class="lbl" x="288" y="78" text-anchor="middle">Assembly</text>
  <text class="sub" x="288" y="97" text-anchor="middle">MetaSPAdes</text>
  <text class="sub" x="288" y="109" text-anchor="middle">MEGAHIT</text>

  <!-- arrow 3→4 -->
  <line class="arr" x1="337" y1="90" x2="350" y2="90"/>

  <!-- Step 4: Viral ID  x=354 cx=401 -->
  <rect class="box" x="354" y="38" width="95" height="104" rx="10"/>
  <circle class="nbg" cx="401" cy="58" r="11"/>
  <text class="num" x="401" y="62" text-anchor="middle">4</text>
  <text class="lbl" x="401" y="74" text-anchor="middle">Viral ID</text>
  <text class="sub" x="401" y="91" text-anchor="middle">VirSorter2</text>
  <text class="sub" x="401" y="103" text-anchor="middle">VIBRANT</text>
  <text class="sub" x="401" y="115" text-anchor="middle">CheckV</text>

  <!-- arrow 4→5 -->
  <line class="arr" x1="450" y1="90" x2="463" y2="90"/>

  <!-- Step 5: Gene Calling  x=467 cx=514 -->
  <rect class="box" x="467" y="38" width="95" height="104" rx="10"/>
  <circle class="nbg" cx="514" cy="58" r="11"/>
  <text class="num" x="514" y="62" text-anchor="middle">5</text>
  <text class="lbl" x="514" y="74" text-anchor="middle">Gene</text>
  <text class="lbl" x="514" y="88" text-anchor="middle">Calling</text>
  <text class="sub" x="514" y="107" text-anchor="middle">Prodigal</text>
  <text class="sub" x="514" y="119" text-anchor="middle">Prokka</text>

  <!-- arrow 5→6 -->
  <line class="arr" x1="563" y1="90" x2="576" y2="90"/>

  <!-- Step 6: Annotation  x=580 cx=627 -->
  <rect class="box" x="580" y="38" width="95" height="104" rx="10"/>
  <circle class="nbg" cx="627" cy="58" r="11"/>
  <text class="num" x="627" y="62" text-anchor="middle">6</text>
  <text class="lbl" x="627" y="78" text-anchor="middle">Annotation</text>
  <text class="sub" x="627" y="97" text-anchor="middle">DRAM-v · VIGA</text>
  <text class="sub" x="627" y="109" text-anchor="middle">Cenote-Taker 2</text>

  <!-- arrow 6→7 -->
  <line class="arr" x1="676" y1="90" x2="689" y2="90"/>

  <!-- Step 7: Taxonomy  x=693 cx=740 -->
  <rect class="box" x="693" y="38" width="95" height="104" rx="10"/>
  <circle class="nbg" cx="740" cy="58" r="11"/>
  <text class="num" x="740" y="62" text-anchor="middle">7</text>
  <text class="lbl" x="740" y="78" text-anchor="middle">Taxonomy</text>
  <text class="sub" x="740" y="97" text-anchor="middle">vConTACT2</text>
  <text class="sub" x="740" y="109" text-anchor="middle">iPHoP · WIsH</text>

  <!-- arrow 7→8 -->
  <line class="arr" x1="789" y1="90" x2="802" y2="90"/>

  <!-- Step 8: Ecology & Viz  x=806 cx=853 -->
  <rect class="box" x="806" y="38" width="95" height="104" rx="10"/>
  <circle class="nbg" cx="853" cy="58" r="11"/>
  <text class="num" x="853" y="62" text-anchor="middle">8</text>
  <text class="lbl" x="853" y="74" text-anchor="middle">Ecology</text>
  <text class="lbl" x="853" y="88" text-anchor="middle">&amp; Viz</text>
  <text class="sub" x="853" y="107" text-anchor="middle">Anvi'o</text>
  <text class="sub" x="853" y="119" text-anchor="middle">Cytoscape</text>
</svg>
