<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" aria-hidden="true">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ab3ff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#72e3ff" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="none"/>
  <!-- tile grid -->
  <g fill="url(#g)" stroke="white" stroke-opacity=".2">
    <!-- 5x3 rounded tiles -->
    <rect x="120" y="120" width="160" height="120" rx="14"/>
    <rect x="320" y="120" width="160" height="120" rx="14"/>
    <rect x="520" y="120" width="160" height="120" rx="14"/>
    <rect x="720" y="120" width="160" height="120" rx="14"/>
    <rect x="920" y="120" width="160" height="120" rx="14"/>

    <rect x="160" y="270" width="160" height="120" rx="14"/>
    <rect x="360" y="270" width="160" height="120" rx="14"/>
    <rect x="560" y="270" width="160" height="120" rx="14"/>
    <rect x="760" y="270" width="160" height="120" rx="14"/>

    <rect x="120" y="420" width="160" height="120" rx="14"/>
    <rect x="320" y="420" width="160" height="120" rx="14"/>
    <rect x="520" y="420" width="160" height="120" rx="14"/>
    <rect x="720" y="420" width="160" height="120" rx="14"/>
  </g>

  <!-- a few accent “app dots” -->
  <g fill="white" opacity=".08">
    <circle cx="240" cy="180" r="6"/>
    <circle cx="600" cy="330" r="6"/>
    <circle cx="840" cy="180" r="6"/>
    <circle cx="400" cy="480" r="6"/>
  </g>
</svg>