<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b6ff2"/>
      <stop offset="100%" stop-color="#7a3df0"/>
    </linearGradient>
    <g id="virus" stroke="url(#ink)" stroke-width="1.6" fill="none">
      <!-- capsid -->
      <circle cx="0" cy="0" r="18"/>
      <!-- spikes (N, NE, E, SE, S, SW, W, NW) -->
      <line x1="0" y1="-24" x2="0" y2="-34"/>
      <line x1="17" y1="-17" x2="24" y2="-24"/>
      <line x1="24" y1="0" x2="34" y2="0"/>
      <line x1="17" y1="17" x2="24" y2="24"/>
      <line x1="0" y1="24" x2="0" y2="34"/>
      <line x1="-17" y1="17" x2="-24" y2="24"/>
      <line x1="-24" y1="0" x2="-34" y2="0"/>
      <line x1="-17" y1="-17" x2="-24" y2="-24"/>
      <!-- small receptors on spikes -->
      <circle cx="0" cy="-36" r="2.6"/>
      <circle cx="26" cy="-26" r="2.6"/>
      <circle cx="36" cy="0" r="2.6"/>
      <circle cx="26" cy="26" r="2.6"/>
      <circle cx="0" cy="36" r="2.6"/>
      <circle cx="-26" cy="26" r="2.6"/>
      <circle cx="-36" cy="0" r="2.6"/>
      <circle cx="-26" cy="-26" r="2.6"/>
    </g>
  </defs>

  <!-- soft background mesh: hex-like connectors -->
  <g stroke="url(#ink)" stroke-opacity="0.25" stroke-width="1.2" fill="none">
    <!-- horizontal rows -->
    <path d="M0 50 L600 50"/>
    <path d="M0 150 L600 150"/>
    <path d="M0 250 L600 250"/>
    <!-- diagonals creating hex pattern -->
    <path d="M-50 100 L650 100"/>
    <path d="M-50 200 L650 200"/>
    <path d="M50 0 L350 300"/>
    <path d="M250 0 L550 300"/>
    <path d="M-50 0 L250 300"/>
    <path d="M150 0 L450 300"/>
  </g>

  <!-- Tile: 5 viruses per tile with varied scales -->
  <g opacity="0.6">
    <g transform="translate(120 60) scale(0.9)"><use href="#virus"/></g>
    <g transform="translate(300 40) scale(0.7)"><use href="#virus"/></g>
    <g transform="translate(480 70) scale(1.0)"><use href="#virus"/></g>
    <g transform="translate(200 200) scale(0.85)"><use href="#virus"/></g>
    <g transform="translate(420 220) scale(0.75)"><use href="#virus"/></g>
  </g>
</svg>
