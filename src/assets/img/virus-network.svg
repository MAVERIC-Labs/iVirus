<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b6ff2" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7a3df0" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Dense network mesh -->
  <g fill="none" stroke="url(#grad)" stroke-width="1" opacity="0.65">
    <!-- top band -->
    <path d="M0 60 L90 30 L180 70 L270 40 L360 80 L450 30 L540 70 L630 40 L720 80 L810 30 L900 70 L1000 40"/>
    <path d="M0 95 L100 70 L200 110 L300 85 L400 120 L500 75 L600 115 L700 90 L800 120 L900 80 L1000 110"/>
    <!-- mid band -->
    <path d="M0 240 L80 210 L160 250 L240 220 L320 260 L400 210 L480 250 L560 220 L640 260 L720 215 L800 255 L880 225 L1000 245"/>
    <path d="M0 280 L100 250 L200 290 L300 260 L400 300 L500 255 L600 295 L700 270 L800 300 L900 260 L1000 295"/>
    <!-- bottom band -->
    <path d="M0 380 L90 350 L180 390 L270 360 L360 400 L450 350 L540 390 L630 360 L720 400 L810 350 L900 390 L1000 360"/>
    <path d="M0 420 L120 390 L240 430 L360 400 L480 440 L600 395 L720 435 L840 405 L960 435 L1000 420"/>
  </g>

  <!-- Nodes -->
  <g fill="#2b6ff2" opacity="0.35">
    <!-- a few along each band -->
    <circle cx="90" cy="30" r="3"/><circle cx="180" cy="70" r="3"/><circle cx="360" cy="80" r="3"/><circle cx="540" cy="70" r="3"/><circle cx="720" cy="80" r="3"/><circle cx="900" cy="70" r="3"/>
    <circle cx="100" cy="70" r="3"/><circle cx="300" cy="85" r="3"/><circle cx="500" cy="75" r="3"/><circle cx="700" cy="90" r="3"/><circle cx="900" cy="80" r="3"/>
    <circle cx="80" cy="210" r="3"/><circle cx="240" cy="220" r="3"/><circle cx="400" cy="210" r="3"/><circle cx="560" cy="220" r="3"/><circle cx="720" cy="215" r="3"/><circle cx="880" cy="225" r="3"/>
    <circle cx="100" cy="250" r="3"/><circle cx="300" cy="260" r="3"/><circle cx="500" cy="255" r="3"/><circle cx="700" cy="270" r="3"/><circle cx="900" cy="260" r="3"/>
    <circle cx="90" cy="350" r="3"/><circle cx="270" cy="360" r="3"/><circle cx="450" cy="350" r="3"/><circle cx="630" cy="360" r="3"/><circle cx="810" cy="350" r="3"/>
    <circle cx="120" cy="390" r="3"/><circle cx="360" cy="400" r="3"/><circle cx="600" cy="395" r="3"/><circle cx="840" cy="405" r="3"/>
  </g>

  <!-- Stylized virus particles (spiky circles) -->
  <g fill="none" stroke="url(#grad)" stroke-width="1.2" opacity="0.8" filter="url(#soft)">
    <!-- left -->
    <g transform="translate(170 135)">
      <circle cx="0" cy="0" r="12"/>
      <g>
        <line x1="0" y1="-16" x2="0" y2="-24"/>
        <line x1="0" y1="16" x2="0" y2="24"/>
        <line x1="-16" y1="0" x2="-24" y2="0"/>
        <line x1="16" y1="0" x2="24" y2="0"/>
        <line x1="-11" y1="-11" x2="-17" y2="-17"/>
        <line x1="11" y1="-11" x2="17" y2="-17"/>
        <line x1="-11" y1="11" x2="-17" y2="17"/>
        <line x1="11" y1="11" x2="17" y2="17"/>
      </g>
    </g>
    <!-- mid -->
    <g transform="translate(510 255) scale(1.15)">
      <circle cx="0" cy="0" r="12"/>
      <g>
        <line x1="0" y1="-16" x2="0" y2="-24"/>
        <line x1="0" y1="16" x2="0" y2="24"/>
        <line x1="-16" y1="0" x2="-24" y2="0"/>
        <line x1="16" y1="0" x2="24" y2="0"/>
        <line x1="-11" y1="-11" x2="-17" y2="-17"/>
        <line x1="11" y1="-11" x2="17" y2="-17"/>
        <line x1="-11" y1="11" x2="-17" y2="17"/>
        <line x1="11" y1="11" x2="17" y2="17"/>
      </g>
    </g>
    <!-- right -->
    <g transform="translate(820 370) scale(0.95)">
      <circle cx="0" cy="0" r="12"/>
      <g>
        <line x1="0" y1="-16" x2="0" y2="-24"/>
        <line x1="0" y1="16" x2="0" y2="24"/>
        <line x1="-16" y1="0" x2="-24" y2="0"/>
        <line x1="16" y1="0" x2="24" y2="0"/>
        <line x1="-11" y1="-11" x2="-17" y2="-17"/>
        <line x1="11" y1="-11" x2="17" y2="-17"/>
        <line x1="-11" y1="11" x2="-17" y2="17"/>
        <line x1="11" y1="11" x2="17" y2="17"/>
      </g>
    </g>
  </g>
</svg>
